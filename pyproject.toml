[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genrevisit-train"
version = "0.1.0"
description = "SFT and NACA training code"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "jsonschema>=4.18", "referencing>=0.30"]

[project.optional-dependencies]
rl = ["torch>=2.7"]
test = ["pytest>=8", "torch>=2.7", "Pillow", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"genrevisit.agent" = ["schemas/*.schema.json"]
